<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260">
  <defs>
    <!-- Border Gradient with shifting color stop animation -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cb8589">
        <animate attributeName="stop-color" values="#cb8589;#b37579;#cb8589" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#b37579">
        <animate attributeName="stop-color" values="#b37579;#ffffff;#b37579" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#cb8589">
        <animate attributeName="stop-color" values="#cb8589;#b37579;#cb8589" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <!-- Glow filter for bullet dots -->
    <filter id="pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#cb8589" flood-opacity="0.8" />
    </filter>
  </defs>
  <style>
    .card-bg {
      fill: #0d1117;
      stroke: url(#border-grad);
      stroke-width: 1.5;
      rx: 12;
    }
    .title {
      font-family: 'Space Mono', 'Segoe UI', monospace;
      font-size: 15px;
      font-weight: bold;
      fill: #ffffff;
    }
    .text-body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 13px;
      fill: #c9d1d9;
    }
    .text-bold {
      font-weight: bold;
      fill: #ffffff;
    }
    .bullet-text {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 12.5px;
      fill: #c9d1d9;
    }
    .bullet-dot {
      fill: #cb8589;
      animation: pulse-dot 2s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.4); opacity: 1; }
    }
  </style>
  
  <!-- Outer card with solid gradient border -->
  <rect width="850" height="260" class="card-bg" />
  
  <!-- Header -->
  <text x="25" y="35" class="title">🚀 ABOUT ME</text>
  <line x1="25" y1="45" x2="825" y2="45" stroke="#30363d" stroke-width="1" />
  
  <!-- Paragraph 1 -->
  <text x="25" y="68" class="text-body">
    I’m a <tspan class="text-bold">Computer Science Engineering student and AI Trainee</tspan> focused on developing practical skills in <tspan class="text-bold">Machine Learning, Deep Learning,</tspan>
  </text>
  <text x="25" y="86" class="text-body">
    <tspan class="text-bold">Generative AI, LLMs, Python, Java, and Web Development</tspan>.
  </text>
  
  <!-- Paragraph 2 -->
  <text x="25" y="112" class="text-body">
    I enjoy understanding how intelligent systems work, building projects from the ground up, and continuously improving through hands-on experimentation.
  </text>
  
  <!-- Bullet List -->
  <!-- Item 1 -->
  <circle cx="32" cy="144" r="3" class="bullet-dot" style="animation-delay: 0s;" filter="url(#pink-glow)" />
  <text x="45" y="148" class="bullet-text">AI Trainee at <tspan class="text-bold">Calibo AI Academy</tspan></text>
  
  <!-- Item 2 -->
  <circle cx="32" cy="168" r="3" class="bullet-dot" style="animation-delay: 0.5s;" filter="url(#pink-glow)" />
  <text x="45" y="172" class="bullet-text">Developing interactive <tspan class="text-bold">Web Applications</tspan></text>
  
  <!-- Item 3 -->
  <circle cx="32" cy="192" r="3" class="bullet-dot" style="animation-delay: 1s;" filter="url(#pink-glow)" />
  <text x="45" y="196" class="bullet-text">Interested in solving real-world problems through technology</text>
  
  <!-- Item 4 -->
  <circle cx="32" cy="216" r="3" class="bullet-dot" style="animation-delay: 1.5s;" filter="url(#pink-glow)" />
  <text x="45" y="220" class="bullet-text">Currently strengthening my skills through projects and practical learning</text>
  
</svg>
