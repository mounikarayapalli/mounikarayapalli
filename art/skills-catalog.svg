<svg xmlns="http://www.w3.org/2000/svg" width="925" height="460" viewBox="0 0 925 460">
  <style>
    .card {
      fill: #0d1117;
      stroke: #cb8589;
      stroke-width: 1.5;
      rx: 12;
    }
    .title {
      font-family: 'Space Mono', 'Segoe UI', monospace;
      font-size: 14.5px;
      font-weight: bold;
      fill: #ffffff;
    }
    .tag-bg {
      fill: #161b22;
      rx: 8;
      stroke: #30363d;
      stroke-width: 0.8;
    }
    .tag-text {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11.5px;
      fill: #c9d1d9;
    }
    .icon {
      stroke: #cb8589;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>
  
  <!-- ROW 1 -->
  <!-- Card 1: Languages -->
  <g transform="translate(10, 10)">
    <rect width="215" height="210" class="card" />
    <!-- Code Tag Icon -->
    <path class="icon" stroke-width="1.8" d="M 23 32 L 18 37 L 23 42 M 33 32 L 38 37 L 33 42 M 30 30 L 26 44" />
    <text x="48" y="42" class="title">Languages</text>
    
    <!-- Tags -->
    <g transform="translate(15, 60)">
      <rect width="60" height="24" class="tag-bg" />
      <text x="30" y="16" text-anchor="middle" class="tag-text">Python</text>
    </g>
    <g transform="translate(85, 60)">
      <rect width="50" height="24" class="tag-bg" />
      <text x="25" y="16" text-anchor="middle" class="tag-text">Java</text>
    </g>
    <g transform="translate(145, 60)">
      <rect width="55" height="24" class="tag-bg" />
      <text x="27.5" y="16" text-anchor="middle" class="tag-text">SQL</text>
    </g>
  </g>
  
  <!-- Card 2: AI & ML -->
  <g transform="translate(240, 10)">
    <rect width="215" height="210" class="card" />
    <!-- Brain Icon -->
    <path class="icon" stroke-width="1.8" d="M 26 27 A 4.5 4.5 0 0 0 22 35 A 3.5 3.5 0 0 0 23 41 A 4.5 4.5 0 0 0 28 43 M 28 27 A 4.5 4.5 0 0 1 32 35 A 3.5 3.5 0 0 1 31 41 A 4.5 4.5 0 0 1 26 43" />
    <text x="48" y="42" class="title">AI &amp; ML</text>
    
    <!-- Tags -->
    <g transform="translate(15, 55)">
      <rect width="115" height="24" class="tag-bg" />
      <text x="57.5" y="16" text-anchor="middle" class="tag-text">Machine Learning</text>
    </g>
    <g transform="translate(140, 55)">
      <rect width="60" height="24" class="tag-bg" />
      <text x="30" y="16" text-anchor="middle" class="tag-text">NLP</text>
    </g>
    
    <g transform="translate(15, 90)">
      <rect width="105" height="24" class="tag-bg" />
      <text x="52.5" y="16" text-anchor="middle" class="tag-text">Computer Vision</text>
    </g>
    <g transform="translate(130, 90)">
      <rect width="70" height="24" class="tag-bg" />
      <text x="35" y="16" text-anchor="middle" class="tag-text">YOLO</text>
    </g>
    
    <g transform="translate(15, 125)">
      <rect width="85" height="24" class="tag-bg" />
      <text x="42.5" y="16" text-anchor="middle" class="tag-text">Generative AI</text>
    </g>
    <g transform="translate(110, 125)">
      <rect width="90" height="24" class="tag-bg" />
      <text x="45" y="16" text-anchor="middle" class="tag-text">Hugging Face</text>
    </g>
    
    <g transform="translate(15, 160)">
      <rect width="50" height="24" class="tag-bg" />
      <text x="25" y="16" text-anchor="middle" class="tag-text">LLMs</text>
    </g>
    <g transform="translate(75, 160)">
      <rect width="125" height="24" class="tag-bg" />
      <text x="62.5" y="16" text-anchor="middle" class="tag-text">Prompt Engineering</text>
    </g>
  </g>
  
  <!-- Card 3: Web development -->
  <g transform="translate(470, 10)">
    <rect width="215" height="210" class="card" />
    <!-- Monitor Icon -->
    <rect x="18" y="27" width="20" height="13" rx="1.5" class="icon" stroke-width="1.8" />
    <path class="icon" stroke-width="1.8" d="M 24 40 L 22 44 L 34 44 L 32 40" />
    <text x="48" y="42" class="title">Web development</text>
    
    <!-- Tags -->
    <g transform="translate(15, 60)">
      <rect width="50" height="24" class="tag-bg" />
      <text x="25" y="16" text-anchor="middle" class="tag-text">HTML</text>
    </g>
    <g transform="translate(75, 60)">
      <rect width="45" height="24" class="tag-bg" />
      <text x="22.5" y="16" text-anchor="middle" class="tag-text">CSS</text>
    </g>
    <g transform="translate(130, 60)">
      <rect width="70" height="24" class="tag-bg" />
      <text x="35" y="16" text-anchor="middle" class="tag-text">JavaScript</text>
    </g>
    
    <g transform="translate(15, 95)">
      <rect width="60" height="24" class="tag-bg" />
      <text x="30" y="16" text-anchor="middle" class="tag-text">jQuery</text>
    </g>
    <g transform="translate(85, 95)">
      <rect width="50" height="24" class="tag-bg" />
      <text x="25" y="16" text-anchor="middle" class="tag-text">DOM</text>
    </g>
    <g transform="translate(145, 95)">
      <rect width="55" height="24" class="tag-bg" />
      <text x="27.5" y="16" text-anchor="middle" class="tag-text">Bootstrap</text>
    </g>
  </g>
  
  <!-- Card 4: Frameworks -->
  <g transform="translate(700, 10)">
    <rect width="215" height="210" class="card" />
    <!-- Stack Icon -->
    <path class="icon" stroke-width="1.8" d="M 18 31 L 28 27 L 38 31 L 28 35 Z M 18 35 L 28 39 L 38 35 M 18 39 L 28 43 L 38 39" />
    <text x="48" y="42" class="title">Frameworks</text>
    
    <!-- Tags -->
    <g transform="translate(15, 55)">
      <rect width="85" height="24" class="tag-bg" />
      <text x="42.5" y="16" text-anchor="middle" class="tag-text">TensorFlow</text>
    </g>
    <g transform="translate(110, 55)">
      <rect width="90" height="24" class="tag-bg" />
      <text x="45" y="16" text-anchor="middle" class="tag-text">Scikit-learn</text>
    </g>
    
    <g transform="translate(15, 90)">
      <rect width="65" height="24" class="tag-bg" />
      <text x="32.5" y="16" text-anchor="middle" class="tag-text">OpenCV</text>
    </g>
    <g transform="translate(90, 90)">
      <rect width="65" height="24" class="tag-bg" />
      <text x="32.5" y="16" text-anchor="middle" class="tag-text">React.js</text>
    </g>
    
    <g transform="translate(15, 125)">
      <rect width="70" height="24" class="tag-bg" />
      <text x="35" y="16" text-anchor="middle" class="tag-text">Streamlit</text>
    </g>
    <g transform="translate(95, 125)">
      <rect width="60" height="24" class="tag-bg" />
      <text x="30" y="16" text-anchor="middle" class="tag-text">FastAPI</text>
    </g>
  </g>
  
  <!-- ROW 2 -->
  <!-- Card 5: Databases -->
  <g transform="translate(10, 240)">
    <rect width="215" height="210" class="card" />
    <!-- Database Icon -->
    <path class="icon" stroke-width="1.8" d="M 18 30 A 10 3.5 0 0 0 38 30 A 10 3.5 0 0 0 18 30 M 18 30 V 35 A 10 3.5 0 0 0 38 35 V 30 M 18 35 V 40 A 10 3.5 0 0 0 38 40 V 35" />
    <text x="48" y="42" class="title">Databases</text>
    
    <!-- Tags -->
    <g transform="translate(15, 60)">
      <rect width="55" height="24" class="tag-bg" />
      <text x="27.5" y="16" text-anchor="middle" class="tag-text">MySQL</text>
    </g>
    <g transform="translate(80, 60)">
      <rect width="70" height="24" class="tag-bg" />
      <text x="35" y="16" text-anchor="middle" class="tag-text">MongoDB</text>
    </g>
    <g transform="translate(15, 95)">
      <rect width="65" height="24" class="tag-bg" />
      <text x="32.5" y="16" text-anchor="middle" class="tag-text">Firebase</text>
    </g>
  </g>
  
  <!-- Card 6: Cloud & Tools -->
  <g transform="translate(240, 240)">
    <rect width="215" height="210" class="card" />
    <!-- Wrench Tool Icon -->
    <path class="icon" stroke-width="1.8" d="M 19 39 L 27 31 M 23 27 A 4 4 0 0 1 31 35 L 35 39 M 32 32 A 4 4 0 0 0 28 28" />
    <text x="48" y="42" class="title">Cloud &amp; Tools</text>
    
    <!-- Tags -->
    <g transform="translate(15, 55)">
      <rect width="65" height="24" class="tag-bg" />
      <text x="32.5" y="16" text-anchor="middle" class="tag-text">Firebase</text>
    </g>
    <g transform="translate(90, 55)">
      <rect width="40" height="24" class="tag-bg" />
      <text x="20" y="16" text-anchor="middle" class="tag-text">Git</text>
    </g>
    <g transform="translate(140, 55)">
      <rect width="60" height="24" class="tag-bg" />
      <text x="30" y="16" text-anchor="middle" class="tag-text">GitHub</text>
    </g>
    
    <g transform="translate(15, 90)">
      <rect width="70" height="24" class="tag-bg" />
      <text x="35" y="16" text-anchor="middle" class="tag-text">Postman</text>
    </g>
    <g transform="translate(95, 90)">
      <rect width="70" height="24" class="tag-bg" />
      <text x="35" y="16" text-anchor="middle" class="tag-text">PyCharm</text>
    </g>
    
    <g transform="translate(15, 125)">
      <rect width="70" height="24" class="tag-bg" />
      <text x="35" y="16" text-anchor="middle" class="tag-text">VS Code</text>
    </g>
  </g>
  
  <!-- Card 7: Core Areas -->
  <g transform="translate(470, 240)">
    <rect width="215" height="210" class="card" />
    <!-- Microchip Icon -->
    <rect x="20" y="27" width="16" height="16" rx="2" class="icon" stroke-width="1.8" />
    <path class="icon" stroke-width="1.8" d="M 28 23 L 28 27 M 32 23 L 32 27 M 28 43 L 28 47 M 32 43 L 32 47 M 16 31 L 20 31 M 16 35 L 20 35 M 36 31 L 40 31 M 36 35 L 40 35" />
    <text x="48" y="42" class="title">Core Areas</text>
    
    <!-- Tags -->
    <g transform="translate(15, 60)">
      <rect width="145" height="24" class="tag-bg" />
      <text x="72.5" y="16" text-anchor="middle" class="tag-text">Full Stack Development</text>
    </g>
    <g transform="translate(15, 95)">
      <rect width="95" height="24" class="tag-bg" />
      <text x="47.5" y="16" text-anchor="middle" class="tag-text">Data Analytics</text>
    </g>
  </g>
  
  <!-- Card 8: Professional Strengths -->
  <g transform="translate(700, 240)">
    <rect width="215" height="210" class="card" />
    <!-- Lightbulb Icon -->
    <path class="icon" stroke-width="1.8" d="M 23 31 a 4 4 0 0 1 8 0 c 0 2 -1 3 -2 4 M 29 35 c -1 1 -2 2 -2 4 M 25 39.5 h 4" />
    <text x="48" y="42" class="title">Strengths</text>
    
    <!-- Tags -->
    <g transform="translate(15, 60)">
      <rect width="105" height="24" class="tag-bg" />
      <text x="52.5" y="16" text-anchor="middle" class="tag-text">Problem Solving</text>
    </g>
    <g transform="translate(15, 95)">
      <rect width="130" height="24" class="tag-bg" />
      <text x="65" y="16" text-anchor="middle" class="tag-text">Continuous Learning</text>
    </g>
    <g transform="translate(15, 130)">
      <rect width="125" height="24" class="tag-bg" />
      <text x="62.5" y="16" text-anchor="middle" class="tag-text">Analytical Thinking</text>
    </g>
  </g>
</svg>
