<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cb8589" />
      <stop offset="100%" stop-color="#b37579" />
    </linearGradient>
    <!-- Glow Filter for central nodes and pulses -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#cb8589" flood-opacity="0.8" />
    </filter>
  </defs>
  
  <style>
    .terminal-bg {
      fill: #090d13;
      stroke: #21262d;
      stroke-width: 1.5;
      rx: 8;
    }
    .log-line {
      font-family: 'Space Mono', 'Fira Code', monospace;
      font-size: 11.5px;
      opacity: 0;
      animation: log-fade 0.3s forwards;
    }
    @keyframes log-fade {
      to { opacity: 1; }
    }
    
    .cursor {
      fill: #cb8589;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    
    .conn-line {
      stroke: #30363d;
      stroke-width: 1.5;
      stroke-dasharray: 4, 4;
    }
    
    .core-wave {
      animation: pulse-ring 3s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes pulse-ring {
      0% {
        transform: scale(0.6);
        opacity: 0.8;
      }
      80%, 100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }
    
    .node-glow {
      fill: #cb8589;
      animation: node-pulse 2s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes node-pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.25); opacity: 1; }
    }
    
    .node-text-title {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11.5px;
      font-weight: bold;
      fill: #ffffff;
    }
    
    .node-text-sub {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 9.5px;
      fill: #8b949e;
    }
  </style>

  <!-- COLUMN 1: Terminal Window -->
  <g transform="translate(10, 10)">
    <rect width="420" height="330" class="terminal-bg" />
    
    <!-- Header -->
    <path d="M 0 30 L 420 30" stroke="#21262d" stroke-width="1.5" />
    <circle cx="20" cy="15" r="4.5" fill="#ff5f56" />
    <circle cx="32" cy="15" r="4.5" fill="#ffbd2e" />
    <circle cx="44" cy="15" r="4.5" fill="#27c93f" />
    <text x="65" y="19" font-family="monospace" font-size="10.5" fill="#8b949e">terminal - mounika@calibo-ai</text>
    
    <!-- Logging text output with sequence timing -->
    <text x="20" y="60" class="log-line" style="animation-delay: 0s;" fill="#8b949e">
      mounika@calibo-ai:~$ <tspan fill="#cb8589">calibo-ai --skills-catalog</tspan>
    </text>
    
    <text x="20" y="85" class="log-line" style="animation-delay: 0.8s;" fill="#8b949e">
      [info] Compiling portfolio skill structures...
    </text>
    
    <text x="20" y="110" class="log-line" style="animation-delay: 1.4s;" fill="#8b949e">
      [info] 8 categories analyzed and loaded.
    </text>
    
    <!-- Category lists -->
    <text x="20" y="135" class="log-line" style="animation-delay: 2.0s;" fill="#c9d1d9">
      &gt; <tspan fill="#cb8589">Languages:</tspan> Python, Java, SQL
    </text>
    
    <text x="20" y="160" class="log-line" style="animation-delay: 2.5s;" fill="#c9d1d9">
      &gt; <tspan fill="#cb8589">AI &amp; ML:</tspan> ML, NLP, YOLO, Hugging Face
    </text>
    
    <text x="20" y="185" class="log-line" style="animation-delay: 3.0s;" fill="#c9d1d9">
      &gt; <tspan fill="#cb8589">Web Dev:</tspan> HTML/CSS, JS, Bootstrap
    </text>
    
    <text x="20" y="210" class="log-line" style="animation-delay: 3.5s;" fill="#c9d1d9">
      &gt; <tspan fill="#cb8589">Cloud/DevOps:</tspan> EKS, Docker, Terraform
    </text>
    
    <text x="20" y="235" class="log-line" style="animation-delay: 4.0s;" fill="#c9d1d9">
      &gt; <tspan fill="#cb8589">Databases:</tspan> MySQL, MongoDB, Firebase
    </text>
    
    <text x="20" y="260" class="log-line" style="animation-delay: 4.5s;" fill="#c9d1d9">
      &gt; <tspan fill="#cb8589">Strengths:</tspan> Problem Solving, Continuous Learning
    </text>
    
    <!-- Success log -->
    <text x="20" y="295" class="log-line" style="animation-delay: 5.2s;" fill="#4AF2A1">
      [success] System status: OPTIMIZED &amp; STABLE
    </text>
    
    <!-- Blinking Cursor -->
    <rect x="290" y="285" width="7" height="13" class="cursor" style="animation-delay: 5.2s;" />
  </g>

  <!-- COLUMN 2: Neural Network Skill Graph -->
  <g transform="translate(450, 10)">
    <!-- Connections -->
    <line x1="230" y1="165" x2="110" y2="80" class="conn-line" />
    <line x1="230" y1="165" x2="230" y2="50" class="conn-line" />
    <line x1="230" y1="165" x2="350" y2="80" class="conn-line" />
    <line x1="230" y1="165" x2="350" y2="250" class="conn-line" />
    <line x1="230" y1="165" x2="230" y2="280" class="conn-line" />
    <line x1="230" y1="165" x2="110" y2="250" class="conn-line" />
    
    <!-- Animated Light Pulses flowing from Core to Nodes -->
    <circle r="3" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="2.5s" repeatCount="indefinite" path="M 230,165 L 110,80" />
    </circle>
    <circle r="3" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 230,165 L 230,50" />
    </circle>
    <circle r="3" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M 230,165 L 350,80" />
    </circle>
    <circle r="3" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M 230,165 L 350,250" />
    </circle>
    <circle r="3" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M 230,165 L 230,280" />
    </circle>
    <circle r="3" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M 230,165 L 110,250" />
    </circle>
    
    <!-- Central Core -->
    <circle cx="230" cy="165" r="28" class="core-wave" fill="none" stroke="#cb8589" stroke-width="1.5" />
    <circle cx="230" cy="165" r="42" class="core-wave" fill="none" stroke="#cb8589" stroke-width="1" />
    <circle cx="230" cy="165" r="14" fill="#cb8589" filter="url(#glow)" />
    <text x="230" y="168" text-anchor="middle" font-family="'Space Mono', monospace" font-size="8.5" font-weight="bold" fill="#ffffff">AI</text>
    
    <!-- Outer Skill Nodes -->
    <!-- Node 1: AI / ML -->
    <circle cx="110" cy="80" r="6" class="node-glow" filter="url(#glow)" />
    <text x="110" y="62" text-anchor="middle" class="node-text-title">AI &amp; ML</text>
    <text x="110" y="96" text-anchor="middle" class="node-text-sub">YOLO · NLP · ML</text>
    
    <!-- Node 2: Cloud / DevOps -->
    <circle cx="230" cy="50" r="6" class="node-glow" filter="url(#glow)" />
    <text x="230" y="32" text-anchor="middle" class="node-text-title">Cloud &amp; DevOps</text>
    <text x="230" y="66" text-anchor="middle" class="node-text-sub">Kubernetes · AWS · Docker</text>
    
    <!-- Node 3: Web Dev -->
    <circle cx="350" cy="80" r="6" class="node-glow" filter="url(#glow)" />
    <text x="350" y="62" text-anchor="middle" class="node-text-title">Web Dev</text>
    <text x="350" y="96" text-anchor="middle" class="node-text-sub">HTML/CSS · JS · Bootstrap</text>
    
    <!-- Node 4: Programming -->
    <circle cx="350" cy="250" r="6" class="node-glow" filter="url(#glow)" />
    <text x="350" y="234" text-anchor="middle" class="node-text-title">Programming</text>
    <text x="350" y="267" text-anchor="middle" class="node-text-sub">Python · Java · SQL</text>
    
    <!-- Node 5: Databases -->
    <circle cx="230" cy="280" r="6" class="node-glow" filter="url(#glow)" />
    <text x="230" y="264" text-anchor="middle" class="node-text-title">Databases</text>
    <text x="230" y="297" text-anchor="middle" class="node-text-sub">MySQL · MongoDB · Firebase</text>
    
    <!-- Node 6: Tools & Strengths -->
    <circle cx="110" cy="250" r="6" class="node-glow" filter="url(#glow)" />
    <text x="110" y="234" text-anchor="middle" class="node-text-title">Strengths</text>
    <text x="110" y="267" text-anchor="middle" class="node-text-sub">Git · Postman · Problem Solving</text>
  </g>
</svg>
