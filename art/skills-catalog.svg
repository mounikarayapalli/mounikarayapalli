<svg xmlns="http://www.w3.org/2000/svg" width="950" height="490" viewBox="0 0 950 490">
  <defs>
    <!-- Shifting Gradient for pill borders -->
    <linearGradient id="pill-border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cb8589">
        <animate attributeName="stop-color" values="#cb8589;#b37579;#cb8589" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#30363d">
        <animate attributeName="stop-color" values="#30363d;#cb8589;#30363d" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <!-- Glow filter for nodes -->
    <filter id="pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#cb8589" flood-opacity="0.8" />
    </filter>
  </defs>
  
  <style>
    .pipeline-line {
      stroke: #21262d;
      stroke-width: 3;
      stroke-linecap: round;
    }
    .branch-line {
      stroke: #21262d;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 3, 3;
    }
    .node-dot {
      fill: #cb8589;
      animation: pulse-node 2s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .category-title {
      font-family: 'Space Mono', 'Segoe UI', monospace;
      font-size: 14.5px;
      font-weight: bold;
      fill: #cb8589;
    }
    .tag-bg {
      fill: #0d1117;
      rx: 8;
      stroke: url(#pill-border-grad);
      stroke-width: 1.2;
    }
    .tag-text {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 12.5px;
      fill: #ffffff;
      font-weight: 500;
    }
  </style>

  <!-- Background Base -->
  <rect width="950" height="490" fill="#0d1117" rx="12" />

  <!-- Center Vertical Pipeline Line -->
  <line x1="475" y1="20" x2="475" y2="470" class="pipeline-line" />
  


  <!-- ROW 1 -->
  <!-- Left Side: Languages (y=60) -->
  <circle cx="475" cy="60" r="5" class="node-dot" filter="url(#pink-glow)" />
  <line x1="475" y1="60" x2="445" y2="60" class="branch-line" />
  <text x="30" y="65" class="category-title">Languages:</text>
  <g transform="translate(160, 48)">
    <rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16.5" text-anchor="middle" class="tag-text">Python</text>
  </g>
  <g transform="translate(235, 48)">
    <rect width="55" height="24" class="tag-bg" /><text x="27.5" y="16.5" text-anchor="middle" class="tag-text">Java</text>
  </g>
  <g transform="translate(300, 48)">
    <rect width="55" height="24" class="tag-bg" /><text x="27.5" y="16.5" text-anchor="middle" class="tag-text">SQL</text>
  </g>

  <!-- Right Side: AI & ML (y=60) -->
  <line x1="475" y1="60" x2="505" y2="60" class="branch-line" />
  <text x="510" y="65" class="category-title">AI &amp; ML:</text>
  <!-- Row 1 of AI/ML -->
  <g transform="translate(640, 23)">
    <rect width="115" height="24" class="tag-bg" /><text x="57.5" y="16.5" text-anchor="middle" class="tag-text">Machine Learning</text>
  </g>
  <g transform="translate(765, 23)">
    <rect width="50" height="24" class="tag-bg" /><text x="25" y="16.5" text-anchor="middle" class="tag-text">NLP</text>
  </g>
  <g transform="translate(825, 23)">
    <rect width="105" height="24" class="tag-bg" /><text x="52.5" y="16.5" text-anchor="middle" class="tag-text">Computer Vision</text>
  </g>
  <!-- Row 2 of AI/ML -->
  <g transform="translate(640, 52)">
    <rect width="90" height="24" class="tag-bg" /><text x="45" y="16.5" text-anchor="middle" class="tag-text">Generative AI</text>
  </g>
  <g transform="translate(740, 52)">
    <rect width="55" height="24" class="tag-bg" /><text x="27.5" y="16.5" text-anchor="middle" class="tag-text">LLMs</text>
  </g>
  <g transform="translate(805, 52)">
    <rect width="55" height="24" class="tag-bg" /><text x="27.5" y="16.5" text-anchor="middle" class="tag-text">YOLO</text>
  </g>
  <!-- Row 3 of AI/ML -->
  <g transform="translate(640, 81)">
    <rect width="130" height="24" class="tag-bg" /><text x="65" y="16.5" text-anchor="middle" class="tag-text">Prompt Engineering</text>
  </g>
  <g transform="translate(780, 81)">
    <rect width="95" height="24" class="tag-bg" /><text x="47.5" y="16.5" text-anchor="middle" class="tag-text">Hugging Face</text>
  </g>

  <!-- ROW 2 -->
  <!-- Left Side: Web Development (y=170) -->
  <circle cx="475" cy="170" r="5" class="node-dot" filter="url(#pink-glow)" />
  <line x1="475" y1="170" x2="445" y2="170" class="branch-line" />
  <text x="30" y="175" class="category-title">Web Dev:</text>
  <!-- Row 1 of Web Dev -->
  <g transform="translate(160, 133)">
    <rect width="55" height="24" class="tag-bg" /><text x="27.5" y="16.5" text-anchor="middle" class="tag-text">HTML</text>
  </g>
  <g transform="translate(225, 133)">
    <rect width="50" height="24" class="tag-bg" /><text x="25" y="16.5" text-anchor="middle" class="tag-text">CSS</text>
  </g>
  <g transform="translate(285, 133)">
    <rect width="80" height="24" class="tag-bg" /><text x="40" y="16.5" text-anchor="middle" class="tag-text">JavaScript</text>
  </g>
  <!-- Row 2 of Web Dev -->
  <g transform="translate(160, 162)">
    <rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16.5" text-anchor="middle" class="tag-text">jQuery</text>
  </g>
  <g transform="translate(235, 162)">
    <rect width="55" height="24" class="tag-bg" /><text x="27.5" y="16.5" text-anchor="middle" class="tag-text">DOM</text>
  </g>
  <g transform="translate(300, 162)">
    <rect width="75" height="24" class="tag-bg" /><text x="37.5" y="16.5" text-anchor="middle" class="tag-text">Bootstrap</text>
  </g>

  <!-- Right Side: Frameworks (y=170) -->
  <line x1="475" y1="170" x2="505" y2="170" class="branch-line" />
  <text x="510" y="175" class="category-title">Frameworks:</text>
  <!-- Row 1 of Frameworks -->
  <g transform="translate(640, 133)">
    <rect width="85" height="24" class="tag-bg" /><text x="42.5" y="16.5" text-anchor="middle" class="tag-text">TensorFlow</text>
  </g>
  <g transform="translate(735, 133)">
    <rect width="90" height="24" class="tag-bg" /><text x="45" y="16.5" text-anchor="middle" class="tag-text">Scikit-learn</text>
  </g>
  <g transform="translate(835, 133)">
    <rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16.5" text-anchor="middle" class="tag-text">OpenCV</text>
  </g>
  <!-- Row 2 of Frameworks -->
  <g transform="translate(640, 162)">
    <rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16.5" text-anchor="middle" class="tag-text">React.js</text>
  </g>
  <g transform="translate(715, 162)">
    <rect width="75" height="24" class="tag-bg" /><text x="37.5" y="16.5" text-anchor="middle" class="tag-text">Streamlit</text>
  </g>
  <g transform="translate(800, 162)">
    <rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16.5" text-anchor="middle" class="tag-text">FastAPI</text>
  </g>

  <!-- ROW 3 -->
  <!-- Left Side: Databases (y=280) -->
  <circle cx="475" cy="280" r="5" class="node-dot" filter="url(#pink-glow)" />
  <line x1="475" y1="280" x2="445" y2="280" class="branch-line" />
  <text x="30" y="285" class="category-title">Databases:</text>
  <g transform="translate(160, 268)">
    <rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16.5" text-anchor="middle" class="tag-text">MySQL</text>
  </g>
  <g transform="translate(235, 268)">
    <rect width="80" height="24" class="tag-bg" /><text x="40" y="16.5" text-anchor="middle" class="tag-text">MongoDB</text>
  </g>
  <g transform="translate(325, 268)">
    <rect width="70" height="24" class="tag-bg" /><text x="35" y="16.5" text-anchor="middle" class="tag-text">Firebase</text>
  </g>

  <!-- Right Side: Cloud & Tools (y=280) -->
  <line x1="475" y1="280" x2="505" y2="280" class="branch-line" />
  <text x="510" y="285" class="category-title">Cloud &amp; Tools:</text>
  <!-- Row 1 of Cloud -->
  <g transform="translate(640, 248)">
    <rect width="70" height="24" class="tag-bg" /><text x="35" y="16.5" text-anchor="middle" class="tag-text">Firebase</text>
  </g>
  <g transform="translate(720, 248)">
    <rect width="40" height="24" class="tag-bg" /><text x="20" y="16.5" text-anchor="middle" class="tag-text">Git</text>
  </g>
  <g transform="translate(770, 248)">
    <rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16.5" text-anchor="middle" class="tag-text">GitHub</text>
  </g>
  <!-- Row 2 of Cloud -->
  <g transform="translate(640, 277)">
    <rect width="70" height="24" class="tag-bg" /><text x="35" y="16.5" text-anchor="middle" class="tag-text">Postman</text>
  </g>
  <g transform="translate(720, 277)">
    <rect width="75" height="24" class="tag-bg" /><text x="37.5" y="16.5" text-anchor="middle" class="tag-text">PyCharm</text>
  </g>
  <g transform="translate(805, 277)">
    <rect width="75" height="24" class="tag-bg" /><text x="37.5" y="16.5" text-anchor="middle" class="tag-text">VS Code</text>
  </g>

  <!-- ROW 4 -->
  <!-- Left Side: Core Areas (y=390) -->
  <circle cx="475" cy="390" r="5" class="node-dot" filter="url(#pink-glow)" />
  <line x1="475" y1="390" x2="445" y2="390" class="branch-line" />
  <text x="30" y="395" class="category-title">Core Areas:</text>
  <g transform="translate(160, 378)">
    <rect width="150" height="24" class="tag-bg" /><text x="75" y="16.5" text-anchor="middle" class="tag-text">Full Stack Development</text>
  </g>
  <g transform="translate(320, 378)">
    <rect width="110" height="24" class="tag-bg" /><text x="55" y="16.5" text-anchor="middle" class="tag-text">AI Development</text>
  </g>

  <!-- Right Side: Professional Strengths (y=390) -->
  <line x1="475" y1="390" x2="505" y2="390" class="branch-line" />
  <text x="510" y="395" class="category-title">Strengths:</text>
  <!-- Row 1 of Strengths -->
  <g transform="translate(640, 358)">
    <rect width="110" height="24" class="tag-bg" /><text x="55" y="16.5" text-anchor="middle" class="tag-text">Problem Solving</text>
  </g>
  <g transform="translate(760, 358)">
    <rect width="130" height="24" class="tag-bg" /><text x="65" y="16.5" text-anchor="middle" class="tag-text">Continuous Learning</text>
  </g>
  <!-- Row 2 of Strengths -->
  <g transform="translate(640, 387)">
    <rect width="120" height="24" class="tag-bg" /><text x="60" y="16.5" text-anchor="middle" class="tag-text">Analytical Thinking</text>
  </g>

</svg>
