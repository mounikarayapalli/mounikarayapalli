<svg xmlns="http://www.w3.org/2000/svg" width="950" height="510" viewBox="0 0 950 510">
  <defs>
    <!-- Shifting Gradient for pill borders -->
    <linearGradient id="pill-border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cb8589">
        <animate attributeName="stop-color" values="#cb8589;#b37579;#cb8589" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#30363d">
        <animate attributeName="stop-color" values="#30363d;#cb8589;#30363d" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <!-- Glow filter for nodes and pulse -->
    <filter id="pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#cb8589" flood-opacity="0.8" />
    </filter>
  </defs>
  
  <style>
    .pipeline-line {
      stroke: #21262d;
      stroke-width: 2.5;
      stroke-linecap: round;
    }
    .branch-line {
      stroke: #21262d;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 3, 3;
    }
    .node-dot {
      fill: #cb8589;
      animation: pulse-node 2s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .category-title {
      font-family: 'Space Mono', 'Segoe UI', monospace;
      font-size: 14px;
      font-weight: bold;
      fill: #cb8589;
    }
    .tag-bg {
      fill: #0d1117;
      rx: 8;
      stroke: url(#pill-border-grad);
      stroke-width: 1.2;
    }
    .tag-text {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 12px;
      fill: #ffffff;
      font-weight: 500;
    }
  </style>

  <!-- Background Base -->
  <rect width="950" height="510" fill="#0d1117" rx="12" />

  <!-- Vertical Pipeline Line -->
  <line x1="50" y1="20" x2="50" y2="490" class="pipeline-line" />
  
  <!-- Glowing signal pulse running down the pipeline -->
  <circle r="4.5" fill="#ffffff" filter="url(#pink-glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 50,20 L 50,490" />
  </circle>

  <!-- CATEGORY 1: Languages (y=45) -->
  <circle cx="50" cy="45" r="5" class="node-dot" filter="url(#pink-glow)" />
  <line x1="50" y1="45" x2="80" y2="45" class="branch-line" />
  <text x="90" y="50" class="category-title">Languages:</text>
  <g transform="translate(200, 33)">
    <g transform="translate(0, 0)"><rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16" text-anchor="middle" class="tag-text">Python</text></g>
    <g transform="translate(75, 0)"><rect width="55" height="24" class="tag-bg" /><text x="27.5" y="16" text-anchor="middle" class="tag-text">Java</text></g>
    <g transform="translate(140, 0)"><rect width="55" height="24" class="tag-bg" /><text x="27.5" y="16" text-anchor="middle" class="tag-text">SQL</text></g>
  </g>

  <!-- CATEGORY 2: AI & ML (y=95, y=122) -->
  <circle cx="50" cy="95" r="5" class="node-dot" filter="url(#pink-glow)" />
  <line x1="50" y1="95" x2="80" y2="95" class="branch-line" />
  <text x="90" y="100" class="category-title">AI &amp; ML:</text>
  <!-- Row 1 of AI/ML -->
  <g transform="translate(200, 83)">
    <g transform="translate(0, 0)"><rect width="115" height="24" class="tag-bg" /><text x="57.5" y="16" text-anchor="middle" class="tag-text">Machine Learning</text></g>
    <g transform="translate(125, 0)"><rect width="50" height="24" class="tag-bg" /><text x="25" y="16" text-anchor="middle" class="tag-text">NLP</text></g>
    <g transform="translate(185, 0)"><rect width="105" height="24" class="tag-bg" /><text x="52.5" y="16" text-anchor="middle" class="tag-text">Computer Vision</text></g>
    <g transform="translate(300, 0)"><rect width="90" height="24" class="tag-bg" /><text x="45" y="16" text-anchor="middle" class="tag-text">Generative AI</text></g>
  </g>
  <!-- Row 2 of AI/ML -->
  <g transform="translate(200, 112)">
    <g transform="translate(0, 0)"><rect width="55" height="24" class="tag-bg" /><text x="27.5" y="16" text-anchor="middle" class="tag-text">LLMs</text></g>
    <g transform="translate(65, 0)"><rect width="125" height="24" class="tag-bg" /><text x="62.5" y="16" text-anchor="middle" class="tag-text">Prompt Engineering</text></g>
    <g transform="translate(200, 0)"><rect width="55" height="24" class="tag-bg" /><text x="27.5" y="16" text-anchor="middle" class="tag-text">YOLO</text></g>
    <g transform="translate(265, 0)"><rect width="95" height="24" class="tag-bg" /><text x="47.5" y="16" text-anchor="middle" class="tag-text">Hugging Face</text></g>
  </g>

  <!-- CATEGORY 3: Web Development (y=162, y=189) -->
  <circle cx="50" cy="162" r="5" class="node-dot" filter="url(#pink-glow)" />
  <line x1="50" y1="162" x2="80" y2="162" class="branch-line" />
  <text x="90" y="167" class="category-title">Web Dev:</text>
  <!-- Row 1 of Web Dev -->
  <g transform="translate(200, 150)">
    <g transform="translate(0, 0)"><rect width="55" height="24" class="tag-bg" /><text x="27.5" y="16" text-anchor="middle" class="tag-text">HTML</text></g>
    <g transform="translate(65, 0)"><rect width="50" height="24" class="tag-bg" /><text x="25" y="16" text-anchor="middle" class="tag-text">CSS</text></g>
    <g transform="translate(125, 0)"><rect width="80" height="24" class="tag-bg" /><text x="40" y="16" text-anchor="middle" class="tag-text">JavaScript</text></g>
  </g>
  <!-- Row 2 of Web Dev -->
  <g transform="translate(200, 179)">
    <g transform="translate(0, 0)"><rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16" text-anchor="middle" class="tag-text">jQuery</text></g>
    <g transform="translate(75, 0)"><rect width="55" height="24" class="tag-bg" /><text x="27.5" y="16" text-anchor="middle" class="tag-text">DOM</text></g>
    <g transform="translate(140, 0)"><rect width="75" height="24" class="tag-bg" /><text x="37.5" y="16" text-anchor="middle" class="tag-text">Bootstrap</text></g>
  </g>

  <!-- CATEGORY 4: Frameworks (y=229, y=256) -->
  <circle cx="50" cy="229" r="5" class="node-dot" filter="url(#pink-glow)" />
  <line x1="50" y1="229" x2="80" y2="229" class="branch-line" />
  <text x="90" y="234" class="category-title">Frameworks:</text>
  <!-- Row 1 of Frameworks -->
  <g transform="translate(200, 217)">
    <g transform="translate(0, 0)"><rect width="85" height="24" class="tag-bg" /><text x="42.5" y="16" text-anchor="middle" class="tag-text">TensorFlow</text></g>
    <g transform="translate(95, 0)"><rect width="90" height="24" class="tag-bg" /><text x="45" y="16" text-anchor="middle" class="tag-text">Scikit-learn</text></g>
    <g transform="translate(195, 0)"><rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16" text-anchor="middle" class="tag-text">OpenCV</text></g>
  </g>
  <!-- Row 2 of Frameworks -->
  <g transform="translate(200, 246)">
    <g transform="translate(0, 0)"><rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16" text-anchor="middle" class="tag-text">React.js</text></g>
    <g transform="translate(75, 0)"><rect width="75" height="24" class="tag-bg" /><text x="37.5" y="16" text-anchor="middle" class="tag-text">Streamlit</text></g>
    <g transform="translate(160, 0)"><rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16" text-anchor="middle" class="tag-text">FastAPI</text></g>
  </g>

  <!-- CATEGORY 5: Databases (y=296) -->
  <circle cx="50" cy="296" r="5" class="node-dot" filter="url(#pink-glow)" />
  <line x1="50" y1="296" x2="80" y2="296" class="branch-line" />
  <text x="90" y="301" class="category-title">Databases:</text>
  <g transform="translate(200, 284)">
    <g transform="translate(0, 0)"><rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16" text-anchor="middle" class="tag-text">MySQL</text></g>
    <g transform="translate(75, 0)"><rect width="80" height="24" class="tag-bg" /><text x="40" y="16" text-anchor="middle" class="tag-text">MongoDB</text></g>
    <g transform="translate(165, 0)"><rect width="70" height="24" class="tag-bg" /><text x="35" y="16" text-anchor="middle" class="tag-text">Firebase</text></g>
  </g>

  <!-- CATEGORY 6: Cloud & Tools (y=346, y=373) -->
  <circle cx="50" cy="346" r="5" class="node-dot" filter="url(#pink-glow)" />
  <line x1="50" y1="346" x2="80" y2="346" class="branch-line" />
  <text x="90" y="351" class="category-title">Cloud &amp; Tools:</text>
  <!-- Row 1 of Cloud -->
  <g transform="translate(200, 334)">
    <g transform="translate(0, 0)"><rect width="70" height="24" class="tag-bg" /><text x="35" y="16" text-anchor="middle" class="tag-text">Firebase</text></g>
    <g transform="translate(80, 0)"><rect width="40" height="24" class="tag-bg" /><text x="20" y="16" text-anchor="middle" class="tag-text">Git</text></g>
    <g transform="translate(130, 0)"><rect width="65" height="24" class="tag-bg" /><text x="32.5" y="16" text-anchor="middle" class="tag-text">GitHub</text></g>
  </g>
  <!-- Row 2 of Cloud -->
  <g transform="translate(200, 363)">
    <g transform="translate(0, 0)"><rect width="70" height="24" class="tag-bg" /><text x="35" y="16" text-anchor="middle" class="tag-text">Postman</text></g>
    <g transform="translate(80, 0)"><rect width="75" height="24" class="tag-bg" /><text x="37.5" y="16" text-anchor="middle" class="tag-text">PyCharm</text></g>
    <g transform="translate(165, 0)"><rect width="75" height="24" class="tag-bg" /><text x="37.5" y="16" text-anchor="middle" class="tag-text">VS Code</text></g>
  </g>

  <!-- CATEGORY 7: Core Areas (y=413) -->
  <circle cx="50" cy="413" r="5" class="node-dot" filter="url(#pink-glow)" />
  <line x1="50" y1="413" x2="80" y2="413" class="branch-line" />
  <text x="90" y="418" class="category-title">Core Areas:</text>
  <g transform="translate(200, 401)">
    <g transform="translate(0, 0)"><rect width="145" height="24" class="tag-bg" /><text x="72.5" y="16" text-anchor="middle" class="tag-text">Full Stack Development</text></g>
    <g transform="translate(155, 0)"><rect width="115" height="24" class="tag-bg" /><text x="57.5" y="16" text-anchor="middle" class="tag-text">AI Development</text></g>
  </g>

  <!-- CATEGORY 8: Strengths (y=463) -->
  <circle cx="50" cy="463" r="5" class="node-dot" filter="url(#pink-glow)" />
  <line x1="50" y1="463" x2="80" y2="463" class="branch-line" />
  <text x="90" y="468" class="category-title">Strengths:</text>
  <g transform="translate(200, 451)">
    <g transform="translate(0, 0)"><rect width="110" height="24" class="tag-bg" /><text x="55" y="16" text-anchor="middle" class="tag-text">Problem Solving</text></g>
    <g transform="translate(120, 0)"><rect width="130" height="24" class="tag-bg" /><text x="65" y="16" text-anchor="middle" class="tag-text">Continuous Learning</text></g>
    <g transform="translate(260, 0)"><rect width="120" height="24" class="tag-bg" /><text x="60" y="16" text-anchor="middle" class="tag-text">Analytical Thinking</text></g>
  </g>

</svg>
