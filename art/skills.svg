  </g>
  <g transform="translate(176, 160)">
    <rect width="56" height="24" class="pill-bg" /><circle cx="11" cy="12" r="3.5" fill="#2196f3" /><text x="21" y="16" class="pill-text">NLP</text>
  </g>
  <g transform="translate(240, 160)">
    <rect width="108" height="24" class="pill-bg" /><circle cx="11" cy="12" r="3.5" fill="#009688" /><text x="21" y="16" class="pill-text">Generative AI</text>
  </g>
  <!-- Row 2 -->
  <g transform="translate(38, 191)">
    <rect width="122" height="24" class="pill-bg" /><circle cx="11" cy="12" r="3.5" fill="#5c3ee8" /><text x="21" y="16" class="pill-text">Computer Vision</text>
  </g>
  <g transform="translate(168, 191)">
    <rect width="64" height="24" class="pill-bg" /><circle cx="11" cy="12" r="3.5" fill="#4caf50" /><text x="21" y="16" class="pill-text">LLMs</text>
