<svg xmlns="http://www.w3.org/2000/svg" width="850" height="492" viewBox="0 0 850 492">
  <defs>
    <!-- Pink Glow Filter for pulsing category dots -->
    <filter id="pink-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#cb8589" flood-opacity="0.85" />
    </filter>
  </defs>

  <style>
    .cat-box {
      fill: #11161d;
      stroke: #21262d;
      stroke-width: 1;
      rx: 8;
    }
    .cat-title {
      font-family: 'Space Mono', 'Segoe UI', monospace;
      font-size: 12.5px;
      font-weight: bold;
      fill: #cb8589;
      letter-spacing: 1.2px;
    }
    .cat-dot {
      fill: #cb8589;
      animation: pulse-dot 2.5s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(0.9); opacity: 0.55; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .pill-bg {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
      rx: 6;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13.5px;
      font-weight: 550;
      fill: #f0f6fc;
    }
  </style>

  <!-- ==================== COLUMN 1 (LEFT) ==================== -->

  <!-- 1. LANGUAGES -->
  <rect x="8" y="4" width="412" height="84" class="cat-box" />
  <circle cx="26" cy="24" r="3.5" class="cat-dot" style="animation-delay: 0s;" filter="url(#pink-glow)" />
  <text x="36" y="28" class="cat-title">LANGUAGES</text>
  <g transform="translate(22, 42)">
    <rect width="86" height="28" class="pill-bg" /><circle cx="12" cy="14" r="4" fill="#3776ab" /><text x="23" y="18.5" class="pill-text">Python</text>
  </g>
  <g transform="translate(116, 42)">
    <rect width="72" height="28" class="pill-bg" /><circle cx="12" cy="14" r="4" fill="#ed8b00" /><text x="23" y="18.5" class="pill-text">Java</text>
  </g>
  <g transform="translate(196, 42)">
    <rect width="68" height="28" class="pill-bg" /><circle cx="12" cy="14" r="4" fill="#4479a1" /><text x="23" y="18.5" class="pill-text">SQL</text>
  </g>

  <!-- 2. AI & ML -->
  <rect x="8" y="102" width="412" height="154" class="cat-box" />
  <circle cx="26" cy="122" r="3.5" class="cat-dot" style="animation-delay: 0.6s;" filter="url(#pink-glow)" />
  <text x="36" y="126" class="cat-title">AI &amp; ML</text>
  <!-- Row 1 -->
  <g transform="translate(22, 140)">
