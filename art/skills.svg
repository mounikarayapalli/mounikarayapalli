<svg xmlns="http://www.w3.org/2000/svg" width="850" height="528" viewBox="0 0 850 528">
  <defs>
    <!-- Border Gradient with shifting color stop animation -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cb8589">
        <animate attributeName="stop-color" values="#cb8589;#b37579;#ffffff;#b37579;#cb8589" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#b37579">
        <animate attributeName="stop-color" values="#b37579;#ffffff;#cb8589;#ffffff;#b37579" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#cb8589">
        <animate attributeName="stop-color" values="#cb8589;#b37579;#ffffff;#b37579;#cb8589" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Subtle radar scanline gradient -->
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cb8589" stop-opacity="0" />
      <stop offset="30%" stop-color="#cb8589" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#cb8589" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#cb8589" stop-opacity="0" />
    </linearGradient>

    <!-- Pink Glow Filter -->
    <filter id="pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#cb8589" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .main-card-bg {
      fill: #0d1117;
      stroke: url(#border-grad);
      stroke-width: 1.5;
      rx: 12;
    }
    .cat-box {
      fill: #11161d;
      stroke: #21262d;
      stroke-width: 1;
      rx: 8;
    }
    .cat-title {
      font-family: 'Space Mono', 'Segoe UI', monospace;
      font-size: 11.5px;
      font-weight: bold;
      fill: #cb8589;
      letter-spacing: 1.2px;
    }
    .cat-dot {
      fill: #cb8589;
      animation: pulse-dot 2.5s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(0.9); opacity: 0.55; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .pill-bg {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
      rx: 5;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      fill: #e6edf3;
    }
  </style>

  <!-- Outer Card with shifting gradient border -->
  <rect width="850" height="528" class="main-card-bg" />

  <!-- Subtle ambient scanline animation across card -->
  <line x1="25" y1="0" x2="825" y2="0" stroke="url(#scan-grad)" stroke-width="1.5" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" values="0,20; 0,505; 0,20" dur="9s" repeatCount="indefinite" />
  </line>

  <!-- ==================== COLUMN 1 (LEFT) ==================== -->

  <!-- 1. LANGUAGES -->
  <rect x="24" y="26" width="390" height="82" class="cat-box" />
  <circle cx="42" cy="46" r="3.5" class="cat-dot" style="animation-delay: 0s;" filter="url(#pink-glow)" />
  <text x="54" y="50" class="cat-title">LANGUAGES</text>
  <g transform="translate(38, 64)">
    <rect width="76" height="24" class="pill-bg" /><circle cx="11" cy="12" r="3.5" fill="#3776ab" /><text x="21" y="16" class="pill-text">Python</text>
  </g>
  <g transform="translate(122, 64)">
    <rect width="64" height="24" class="pill-bg" /><circle cx="11" cy="12" r="3.5" fill="#ed8b00" /><text x="21" y="16" class="pill-text">Java</text>
  </g>
  <g transform="translate(194, 64)">
    <rect width="60" height="24" class="pill-bg" /><circle cx="11" cy="12" r="3.5" fill="#4479a1" /><text x="21" y="16" class="pill-text">SQL</text>
  </g>

  <!-- 2. AI & ML -->
  <rect x="24" y="122" width="390" height="154" class="cat-box" />
