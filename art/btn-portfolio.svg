<svg xmlns="http://www.w3.org/2000/svg" width="160" height="45" viewBox="0 0 160 45">
  <defs>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1F5C" />
      <stop offset="100%" stop-color="#8B2D6B" />
    </linearGradient>
    <linearGradient id="shine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7A1F5C" flood-opacity="0.4" />
    </filter>
  </defs>
  <style>
    .btn-bg {
      fill: url(#btn-grad);
      rx: 22.5;
    }
    .shine {
      fill: url(#shine-grad);
      animation: shine-sweep 3s infinite ease-in-out;
    }
    .btn-text {
      font-family: 'DM Sans', 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: bold;
      fill: #ffffff;
    }
    .btn-icon {
      fill: #ffffff;
    }
    @keyframes shine-sweep {
      0% {
        transform: translateX(-160px) skewX(-30deg);
      }
      40%, 100% {
        transform: translateX(160px) skewX(-30deg);
      }
    }
    .button-group {
      animation: float 4s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
  </style>
  <g class="button-group" filter="url(#shadow)">
    <rect width="160" height="45" class="btn-bg" />
    <rect width="100" height="45" class="shine" />
    
    <!-- Vercel logo -->
    <path class="btn-icon" d="M 30 15 L 39 29 L 21 29 Z" />
    
    <text x="54" y="27" class="btn-text">My Portfolio</text>
  </g>
</svg>
