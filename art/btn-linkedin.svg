<svg xmlns="http://www.w3.org/2000/svg" width="160" height="45" viewBox="0 0 160 45">
  <defs>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cb8589" />
      <stop offset="100%" stop-color="#b37579" />
    </linearGradient>
    <linearGradient id="shine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .btn-bg {
      fill: url(#btn-grad);
      rx: 22.5;
    }
    .shine {
      fill: url(#shine-grad);
      animation: shine-sweep 3s infinite ease-in-out;
    }
    .btn-text {
      font-family: 'DM Sans', 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: bold;
      fill: #ffffff;
    }
  </style>
  <g>
    <rect width="160" height="45" class="btn-bg" />
    <rect width="100" height="45" class="shine" />
    
    <!-- White LinkedIn Box -->
    <rect x="20" y="14" width="17" height="17" rx="2.5" fill="#ffffff" />
    
    <!-- Cutout letters 'i' and 'n' utilizing the background button gradient -->
    <rect x="23" y="21" width="2.5" height="7" fill="url(#btn-grad)" />
    <circle cx="24.25" cy="18.6" r="1.3" fill="url(#btn-grad)" />
    <path d="M 28.5 21.2 h 2.2 v 1 c 0.4 -0.6 1 -1.1 2 -1.1 c 1.5 0 2.2 1 2.2 2.5 v 4.6 h -2.2 v -3.8 c 0 -0.7 -0.3 -1.2 -0.9 -1.2 c -0.6 0 -0.9 0.4 -0.9 1.2 v 3.8 h -2.4 z" fill="url(#btn-grad)" />
    
    <text x="54" y="27" class="btn-text">LinkedIn</text>
  </g>
</svg>
