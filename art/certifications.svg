<svg xmlns="http://www.w3.org/2000/svg" width="850" height="415" viewBox="0 0 850 415">
  <defs>
    <!-- Card Border Gradient -->
    <linearGradient id="cert-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cb8589">
        <animate attributeName="stop-color" values="#cb8589;#b37579;#cb8589" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#30363d">
        <animate attributeName="stop-color" values="#30363d;#cb8589;#30363d" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#b37579">
        <animate attributeName="stop-color" values="#b37579;#30363d;#b37579" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <!-- Badge Glow -->
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#cb8589" flood-opacity="0.8" />
    </filter>
  </defs>
  
  <style>
    .main-bg {
      fill: #0d1117;
      stroke: url(#cert-border);
      stroke-width: 1.5;
      rx: 12;
    }
    .title {
      font-family: 'Space Mono', 'Segoe UI', monospace;
      font-size: 15px;
      font-weight: bold;
      fill: #ffffff;
    }
    .card {
      fill: #090d13;
      stroke: url(#cert-border);
      stroke-width: 1.2;
      rx: 8;
    }
    .cert-title {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: bold;
      fill: #ffffff;
    }
    .cert-issuer {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 9.5px;
      fill: #cb8589;
      font-weight: 600;
    }
    .cert-desc {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 9.5px;
      fill: #8b949e;
    }
    .badge-icon {
      fill: #cb8589;
    }
  </style>

  <!-- Background Card -->
  <rect width="850" height="415" class="main-bg" />
  
  <!-- Header -->
  <text x="25" y="35" class="title">🏆 CERTIFICATIONS &amp; LEARNING</text>
  <line x1="25" y1="45" x2="825" y2="45" stroke="#30363d" stroke-width="1" />
  
  <!-- ROW 1 -->
  <!-- Card 1: Hedera -->
  <g transform="translate(20, 65)">
    <rect width="250" height="150" class="card" />
    <!-- Ribbon Icon -->
    <path class="badge-icon" filter="url(#badge-glow)" d="M 220 0 L 235 0 L 235 20 L 227.5 15 L 220 20 Z" />
    <g transform="translate(15, 20)">
      <text x="0" y="10" class="cert-title">Hedera Certified Professional Suite</text>
      <text x="0" y="26" class="cert-issuer">The Hashgraph Association · 2026</text>
      <text x="0" y="48" class="cert-desc">Earned three official Hedera credentials:</text>
      <text x="0" y="62" class="cert-desc">Developer Associate (HCDA), Foundation (HCF),</text>
      <text x="0" y="76" class="cert-desc">and Business Foundation (HBF).</text>
    </g>
  </g>
  
  <!-- Card 2: HCI -->
  <g transform="translate(290, 65)">
    <rect width="250" height="150" class="card" />
    <path class="badge-icon" filter="url(#badge-glow)" d="M 220 0 L 235 0 L 235 20 L 227.5 15 L 220 20 Z" />
    <g transform="translate(15, 20)">
      <text x="0" y="10" class="cert-title">Human Computer Interaction</text>
      <text x="0" y="26" class="cert-issuer">NPTEL (SWAYAM) · 2026</text>
      <text x="0" y="48" class="cert-desc">Earned an Elite + Silver certification with a</text>
      <text x="0" y="62" class="cert-desc">consolidated score of 83% from IIIT Delhi.</text>
    </g>
  </g>
  
  <!-- Card 3: Blockchain -->
  <g transform="translate(560, 65)">
    <rect width="250" height="150" class="card" />
    <path class="badge-icon" filter="url(#badge-glow)" d="M 220 0 L 235 0 L 235 20 L 227.5 15 L 220 20 Z" />
    <g transform="translate(15, 20)">
      <text x="0" y="10" class="cert-title">Blockchain and its Applications</text>
      <text x="0" y="26" class="cert-issuer">NPTEL (SWAYAM) · 2026</text>
      <text x="0" y="48" class="cert-desc">Completed the 12-week course covering</text>
      <text x="0" y="62" class="cert-desc">blockchain models, smart contracts, and</text>
      <text x="0" y="76" class="cert-desc">consensus from IIT Kharagpur.</text>
    </g>
  </g>
  
  <!-- ROW 2 -->
  <!-- Card 4: Oracle -->
  <g transform="translate(20, 240)">
    <rect width="250" height="150" class="card" />
    <path class="badge-icon" filter="url(#badge-glow)" d="M 220 0 L 235 0 L 235 20 L 227.5 15 L 220 20 Z" />
    <g transform="translate(15, 20)">
      <text x="0" y="10" class="cert-title">Oracle Cloud Foundations Associate</text>
      <text x="0" y="26" class="cert-issuer">ORACLE University · 2025</text>
      <text x="0" y="48" class="cert-desc">Gained knowledge of cloud concepts, OCI</text>
      <text x="0" y="62" class="cert-desc">services, security, and pricing models.</text>
    </g>
  </g>
  
  <!-- Card 5: AI Foundation -->
  <g transform="translate(290, 240)">
    <rect width="250" height="150" class="card" />
    <path class="badge-icon" filter="url(#badge-glow)" d="M 220 0 L 235 0 L 235 20 L 227.5 15 L 220 20 Z" />
    <g transform="translate(15, 20)">
      <text x="0" y="10" class="cert-title">AI Foundation Certification</text>
      <text x="0" y="26" class="cert-issuer">Infosys Springboard · 2025</text>
      <text x="0" y="48" class="cert-desc">Acquired core AI concepts, learning models,</text>
      <text x="0" y="62" class="cert-desc">and foundational artificial intelligence</text>
      <text x="0" y="76" class="cert-desc">principles.</text>
    </g>
  </g>
  
  <!-- Card 6: Python Foundation -->
  <g transform="translate(560, 240)">
    <rect width="250" height="150" class="card" />
    <path class="badge-icon" filter="url(#badge-glow)" d="M 220 0 L 235 0 L 235 20 L 227.5 15 L 220 20 Z" />
    <g transform="translate(15, 20)">
      <text x="0" y="10" class="cert-title">Python Foundation</text>
      <text x="0" y="26" class="cert-issuer">Infosys Springboard · 2024</text>
      <text x="0" y="48" class="cert-desc">Learned core Python programming, data</text>
      <text x="0" y="62" class="cert-desc">handling, and object-oriented concepts.</text>
    </g>
  </g>
  
</svg>
