<svg xmlns="http://www.w3.org/2000/svg" width="850" height="510" viewBox="0 0 850 510">
  <defs>
    <!-- Glow filter -->
    <filter id="pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#cb8589" flood-opacity="0.8" />
    </filter>
  </defs>
  
  <style>
    .timeline-track {
      stroke: #21262d;
      stroke-width: 2.5;
      stroke-linecap: round;
    }
    .branch-line {
      stroke: #21262d;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 2, 2;
    }
    .node-dot {
      fill: #cb8589;
      animation: pulse-dot 2s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .list-card {
      fill: #090d13;
      stroke: #21262d;
      stroke-width: 1.2;
      rx: 8;
      transition: fill 0.3s;
    }
    .list-card:hover {
      fill: #161b22;
    }
    .cert-title {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 15px;
      font-weight: bold;
      fill: #ffffff;
    }
    .cert-desc {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 12.5px;
      fill: #8b949e;
    }
    .cert-issuer {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 13px;
      fill: #cb8589;
      font-weight: bold;
    }
  </style>

  <!-- Transparent Background -->
  <rect width="850" height="510" fill="none" />
  
  <!-- Vertical Track Line -->
  <line x1="25" y1="20" x2="25" y2="454" class="timeline-track" />
  
  <!-- ROW 1: Hedera -->
  <circle cx="25" cy="54" r="5" class="node-dot" style="animation-delay: 0s;" filter="url(#pink-glow)" />
  <line x1="25" y1="54" x2="50" y2="54" class="branch-line" />
  <g transform="translate(50, 20)">
    <rect width="780" height="68" class="list-card" />
    <path d="M 0 8 L 0 60" stroke="#cb8589" stroke-width="3" stroke-linecap="round" />
    <text x="20" y="28" class="cert-title">Hedera Certified Professional Suite</text>
    <text x="20" y="50" class="cert-desc">Developer Associate (HCDA), Foundation (HCF), and Business Foundation (HBF).</text>
    <text x="760" y="38" text-anchor="end" class="cert-issuer">The Hashgraph Association · 2026</text>
  </g>

  <!-- ROW 2: HCI -->
  <circle cx="25" cy="134" r="5" class="node-dot" style="animation-delay: 1.1s;" filter="url(#pink-glow)" />
  <line x1="25" y1="134" x2="50" y2="134" class="branch-line" />
  <g transform="translate(50, 100)">
    <rect width="780" height="68" class="list-card" />
    <path d="M 0 8 L 0 60" stroke="#cb8589" stroke-width="3" stroke-linecap="round" />
    <text x="20" y="28" class="cert-title">Human Computer Interaction</text>
    <text x="20" y="50" class="cert-desc">Earned an Elite + Silver certification with a consolidated score of 83% from IIIT Delhi.</text>
    <text x="760" y="38" text-anchor="end" class="cert-issuer">NPTEL (SWAYAM) · 2026</text>
  </g>

  <!-- ROW 3: Blockchain -->
  <circle cx="25" cy="214" r="5" class="node-dot" style="animation-delay: 2.2s;" filter="url(#pink-glow)" />
  <line x1="25" y1="214" x2="50" y2="214" class="branch-line" />
  <g transform="translate(50, 180)">
    <rect width="780" height="68" class="list-card" />
    <path d="M 0 8 L 0 60" stroke="#cb8589" stroke-width="3" stroke-linecap="round" />
    <text x="20" y="28" class="cert-title">Blockchain and its Applications</text>
    <text x="20" y="50" class="cert-desc">Completed the 12-week course covering blockchain models, smart contracts, and consensus from IIT Kharagpur.</text>
    <text x="760" y="38" text-anchor="end" class="cert-issuer">NPTEL (SWAYAM) · 2026</text>
  </g>

  <!-- ROW 4: Oracle -->
  <circle cx="25" cy="294" r="5" class="node-dot" style="animation-delay: 3.3s;" filter="url(#pink-glow)" />
  <line x1="25" y1="294" x2="50" y2="294" class="branch-line" />
  <g transform="translate(50, 260)">
    <rect width="780" height="68" class="list-card" />
    <path d="M 0 8 L 0 60" stroke="#cb8589" stroke-width="3" stroke-linecap="round" />
    <text x="20" y="28" class="cert-title">Oracle Cloud Foundations Associate</text>
    <text x="20" y="50" class="cert-desc">Gained knowledge of cloud concepts, OCI services, security, and pricing models.</text>
    <text x="760" y="38" text-anchor="end" class="cert-issuer">ORACLE University · 2025</text>
  </g>

  <!-- ROW 5: AI Foundation -->
  <circle cx="25" cy="374" r="5" class="node-dot" style="animation-delay: 4.4s;" filter="url(#pink-glow)" />
  <line x1="25" y1="374" x2="50" y2="374" class="branch-line" />
  <g transform="translate(50, 340)">
    <rect width="780" height="68" class="list-card" />
    <path d="M 0 8 L 0 60" stroke="#cb8589" stroke-width="3" stroke-linecap="round" />
    <text x="20" y="28" class="cert-title">Artificial Intelligence Foundation Certification</text>
    <text x="20" y="50" class="cert-desc">Acquired core AI concepts, learning models, and foundational artificial intelligence principles.</text>
    <text x="760" y="38" text-anchor="end" class="cert-issuer">Infosys Springboard · 2025</text>
  </g>

  <!-- ROW 6: Python Foundation -->
  <circle cx="25" cy="454" r="5" class="node-dot" style="animation-delay: 5.5s;" filter="url(#pink-glow)" />
  <line x1="25" y1="454" x2="50" y2="454" class="branch-line" />
  <g transform="translate(50, 420)">
    <rect width="780" height="68" class="list-card" />
    <path d="M 0 8 L 0 60" stroke="#cb8589" stroke-width="3" stroke-linecap="round" />
    <text x="20" y="28" class="cert-title">Python Foundation</text>
    <text x="20" y="50" class="cert-desc">Learned core Python programming, data handling, and object-oriented concepts.</text>
    <text x="760" y="38" text-anchor="end" class="cert-issuer">Infosys Springboard · 2024</text>
  </g>
</svg>
