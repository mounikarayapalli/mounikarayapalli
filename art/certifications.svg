<svg xmlns="http://www.w3.org/2000/svg" width="850" height="440" viewBox="0 0 850 440">
  <defs>
    <!-- Glow filter -->
    <filter id="pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#cb8589" flood-opacity="0.8" />
    </filter>
  </defs>
  
  <style>
    .timeline-track {
      stroke: #21262d;
      stroke-width: 2.5;
      stroke-linecap: round;
    }
    .branch-line {
      stroke: #21262d;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 2, 2;
    }
    .node-dot {
      fill: #cb8589;
      animation: pulse-dot 2s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .list-card {
      fill: #090d13;
      stroke: #21262d;
      stroke-width: 1.2;
      rx: 8;
      transition: fill 0.3s;
    }
    .list-card:hover {
      fill: #161b22;
    }
    .cert-title {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 13px;
      font-weight: bold;
      fill: #ffffff;
    }
    .cert-desc {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11px;
      fill: #8b949e;
    }
    .cert-issuer {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11.5px;
      fill: #cb8589;
      font-weight: bold;
    }
  </style>

  <!-- Transparent Background -->
  <rect width="850" height="440" fill="none" />
  
  <!-- Vertical Track Line -->
  <line x1="25" y1="20" x2="25" y2="420" class="timeline-track" />
  
  <!-- Animated light pulse dot moving along the track -->
  <circle r="4.5" fill="#ffffff" filter="url(#pink-glow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M 25,20 L 25,420" />
  </circle>
  
  <!-- ROW 1: Hedera -->
  <circle cx="25" cy="48" r="5" class="node-dot" style="animation-delay: 0s;" filter="url(#pink-glow)" />
  <line x1="25" y1="48" x2="50" y2="48" class="branch-line" />
  <g transform="translate(50, 20)">
    <rect width="780" height="56" class="list-card" />
    <path d="M 0 8 L 0 48" stroke="#cb8589" stroke-width="3" stroke-linecap="round" />
    <text x="20" y="24" class="cert-title">Hedera Certified Professional Suite</text>
    <text x="20" y="42" class="cert-desc">Developer Associate (HCDA), Foundation (HCF), and Business Foundation (HBF).</text>
    <text x="760" y="32" text-anchor="end" class="cert-issuer">The Hashgraph Association · 2026</text>
  </g>

  <!-- ROW 2: HCI -->
  <circle cx="25" cy="118" r="5" class="node-dot" style="animation-delay: 1.1s;" filter="url(#pink-glow)" />
  <line x1="25" y1="118" x2="50" y2="118" class="branch-line" />
  <g transform="translate(50, 90)">
    <rect width="780" height="56" class="list-card" />
    <path d="M 0 8 L 0 48" stroke="#cb8589" stroke-width="3" stroke-linecap="round" />
    <text x="20" y="24" class="cert-title">Human Computer Interaction</text>
    <text x="20" y="42" class="cert-desc">Earned an Elite + Silver certification with a consolidated score of 83% from IIIT Delhi.</text>
    <text x="760" y="32" text-anchor="end" class="cert-issuer">NPTEL (SWAYAM) · 2026</text>
  </g>

  <!-- ROW 3: Blockchain -->
  <circle cx="25" cy="188" r="5" class="node-dot" style="animation-delay: 2.2s;" filter="url(#pink-glow)" />
  <line x1="25" y1="188" x2="50" y2="188" class="branch-line" />
  <g transform="translate(50, 160)">
    <rect width="780" height="56" class="list-card" />
    <path d="M 0 8 L 0 48" stroke="#cb8589" stroke-width="3" stroke-linecap="round" />
    <text x="20" y="24" class="cert-title">Blockchain and its Applications</text>
    <text x="20" y="42" class="cert-desc">Completed the 12-week course covering blockchain models, smart contracts, and consensus from IIT Kharagpur.</text>
    <text x="760" y="32" text-anchor="end" class="cert-issuer">NPTEL (SWAYAM) · 2026</text>
  </g>

  <!-- ROW 4: Oracle -->
  <circle cx="25" cy="258" r="5" class="node-dot" style="animation-delay: 3.3s;" filter="url(#pink-glow)" />
  <line x1="25" y1="258" x2="50" y2="258" class="branch-line" />
  <g transform="translate(50, 230)">
    <rect width="780" height="56" class="list-card" />
    <path d="M 0 8 L 0 48" stroke="#cb8589" stroke-width="3" stroke-linecap="round" />
    <text x="20" y="24" class="cert-title">Oracle Cloud Foundations Associate</text>
    <text x="20" y="42" class="cert-desc">Gained knowledge of cloud concepts, OCI services, security, and pricing models.</text>
    <text x="760" y="32" text-anchor="end" class="cert-issuer">ORACLE University · 2025</text>
  </g>

  <!-- ROW 5: AI Foundation -->
  <circle cx="25" cy="328" r="5" class="node-dot" style="animation-delay: 4.4s;" filter="url(#pink-glow)" />
  <line x1="25" y1="328" x2="50" y2="328" class="branch-line" />
  <g transform="translate(50, 300)">
    <rect width="780" height="56" class="list-card" />
    <path d="M 0 8 L 0 48" stroke="#cb8589" stroke-width="3" stroke-linecap="round" />
    <text x="20" y="24" class="cert-title">AI Foundation Certification</text>
    <text x="20" y="42" class="cert-desc">Acquired core AI concepts, learning models, and foundational artificial intelligence principles.</text>
    <text x="760" y="32" text-anchor="end" class="cert-issuer">Infosys Springboard · 2025</text>
  </g>

  <!-- ROW 6: Python Foundation -->
  <circle cx="25" cy="398" r="5" class="node-dot" style="animation-delay: 5.5s;" filter="url(#pink-glow)" />
  <line x1="25" y1="398" x2="50" y2="398" class="branch-line" />
  <g transform="translate(50, 370)">
    <rect width="780" height="56" class="list-card" />
    <path d="M 0 8 L 0 48" stroke="#cb8589" stroke-width="3" stroke-linecap="round" />
    <text x="20" y="24" class="cert-title">Python Foundation</text>
    <text x="20" y="42" class="cert-desc">Learned core Python programming, data handling, and object-oriented concepts.</text>
    <text x="760" y="32" text-anchor="end" class="cert-issuer">Infosys Springboard · 2024</text>
  </g>
</svg>
