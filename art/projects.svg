<svg xmlns="http://www.w3.org/2000/svg" width="950" height="300" viewBox="0 0 950 300">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="card-stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cb8589">
        <animate attributeName="stop-color" values="#cb8589;#b37579;#cb8589" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#30363d">
        <animate attributeName="stop-color" values="#30363d;#cb8589;#30363d" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#b37579">
        <animate attributeName="stop-color" values="#b37579;#30363d;#b37579" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#cb8589" flood-opacity="0.8" />
    </filter>
  </defs>
  
  <style>
    .card {
      fill: #0d1117;
      stroke: url(#card-stroke-grad);
      stroke-width: 1.2;
      rx: 10;
      transition: fill 0.3s;
    }
    .card:hover {
      fill: #161b22;
    }
    .proj-title {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 14.5px;
      font-weight: bold;
      fill: #ffffff;
    }
    .proj-desc {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11.5px;
      fill: #8b949e;
    }
    .proj-tag {
      font-family: 'Space Mono', monospace;
      font-size: 9.5px;
      fill: #cb8589;
      font-weight: bold;
    }
    .btn-bg {
      fill: #21262d;
      rx: 5;
      stroke: #30363d;
      stroke-width: 1;
    }
    .btn-text {
      font-family: 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: bold;
      fill: #c9d1d9;
    }
    .btn-group:hover .btn-bg {
      fill: #cb8589;
      stroke: #cb8589;
    }
    .btn-group:hover .btn-text {
      fill: #0d1117;
    }
  </style>

  <!-- Background Base -->
  <rect width="950" height="300" fill="#0d1117" rx="12" />

  <!-- ROW 1 -->
  <!-- Project 1: AI Medical Assistant -->
  <g transform="translate(20, 20)">
    <rect width="445" height="120" class="card" />
    <g transform="translate(15, 18)">
      <text x="0" y="10" class="proj-title">🧠 AI Medical Assistant</text>
      <text x="0" y="32" class="proj-desc">An intelligent healthcare assistant designed to assist with medical inquiries</text>
      <text x="0" y="47" class="proj-desc">and preliminary symptom analysis using advanced NLP and ML models.</text>
      <text x="0" y="70" class="proj-tag">AI · Machine Learning · Medical NLP · Diagnosis</text>
      
      <!-- Link Button -->
      <a href="https://github.com/mounikarayapalli/AI-Medical-Assistant" target="_blank" class="btn-group">
        <rect x="0" y="80" width="105" height="22" class="btn-bg" />
        <text x="52.5" y="94.5" text-anchor="middle" class="btn-text">Repository ↗</text>
      </a>
    </g>
  </g>

  <!-- Project 2: Developer Portfolio -->
  <g transform="translate(485, 20)">
    <rect width="445" height="120" class="card" />
    <g transform="translate(15, 18)">
      <text x="0" y="10" class="proj-title">💼 Developer Portfolio</text>
      <text x="0" y="32" class="proj-desc">Personal developer portfolio website designed to showcase projects,</text>
      <text x="0" y="47" class="proj-desc">technical skills, and internship history with a fully responsive layout.</text>
      <text x="0" y="70" class="proj-tag">React · HTML · CSS · JavaScript</text>
      
      <!-- Link Button -->
      <a href="https://github.com/mounikarayapalli/mounika-portfolio" target="_blank" class="btn-group">
        <rect x="0" y="80" width="105" height="22" class="btn-bg" />
        <text x="52.5" y="94.5" text-anchor="middle" class="btn-text">Repository ↗</text>
      </a>
    </g>
  </g>

  <!-- ROW 2 -->
  <!-- Project 3: TECH-DESIRE -->
  <g transform="translate(20, 160)">
    <rect width="445" height="120" class="card" />
    <g transform="translate(15, 18)">
      <text x="0" y="10" class="proj-title">🎓 TECH-DESIRE</text>
      <text x="0" y="32" class="proj-desc">Interactive educational platform for software engineering trainees,</text>
      <text x="0" y="47" class="proj-desc">offering dynamic study paths and automated quiz validations.</text>
      <text x="0" y="70" class="proj-tag">HTML · CSS · JavaScript · Bootstrap</text>
      
      <!-- Link Button -->
      <a href="https://github.com/mounikarayapalli/TECH-DESIRE" target="_blank" class="btn-group">
        <rect x="0" y="80" width="105" height="22" class="btn-bg" />
        <text x="52.5" y="94.5" text-anchor="middle" class="btn-text">Repository ↗</text>
      </a>
    </g>
  </g>

  <!-- Project 4: Restaurant Landing Page -->
  <g transform="translate(485, 160)">
    <rect width="445" height="120" class="card" />
    <g transform="translate(15, 18)">
      <text x="0" y="10" class="proj-title">🍽️ Restaurant Landing Page</text>
      <text x="0" y="32" class="proj-desc">A premium responsive restaurant landing page featuring interactive menus,</text>
      <text x="0" y="47" class="proj-desc">booking showcases, and staff profiles.</text>
      <text x="0" y="70" class="proj-tag">HTML · CSS · JavaScript · Responsive Design</text>
      
      <!-- Link Button -->
      <a href="https://github.com/mounikarayapalli/restaurant-landing-page" target="_blank" class="btn-group">
        <rect x="0" y="80" width="105" height="22" class="btn-bg" />
        <text x="52.5" y="94.5" text-anchor="middle" class="btn-text">Repository ↗</text>
      </a>
    </g>
  </g>
</svg>
