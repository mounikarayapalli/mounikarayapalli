<svg xmlns="http://www.w3.org/2000/svg" width="160" height="45" viewBox="0 0 160 45">
  <defs>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cb8589" />
      <stop offset="100%" stop-color="#b37579" />
    </linearGradient>
    <linearGradient id="shine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .btn-bg {
      fill: url(#btn-grad);
      rx: 22.5;
    }
    .shine {
      fill: url(#shine-grad);
      animation: shine-sweep 3s infinite ease-in-out;
    }
    .btn-text {
      font-family: 'DM Sans', 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: bold;
      fill: #ffffff;
    }
  </style>
  <g>
    <rect width="160" height="45" class="btn-bg" />
    <rect width="100" height="45" class="shine" />
    
    <!-- White Envelope Icon -->
    <rect x="20" y="16" width="18" height="13" rx="2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <path d="M20 17.5 L29 23 L38 17.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="54" y="27" class="btn-text">Email Me</text>
  </g>
</svg>
