<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <style>
    .bg { fill: #0d1117; }
    .title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 700;
      font-size: 32px;
      fill: url(#grad-title);
      filter: drop-shadow(0px 0px 8px rgba(239, 147, 196, 0.6));
    }
    .subtitle {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 16px;
      fill: #8b949e;
      letter-spacing: 4px;
      animation: pulse 3s infinite ease-in-out;
    }
    .grid-line {
      stroke: #30363d;
      stroke-width: 0.5;
    }
    .node {
      fill: #EF93C4;
      animation: float 4s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }
    .node-glow {
      fill: #FF69B4;
      opacity: 0.4;
      filter: blur(4px);
      animation: pulse-node 3s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }
    .connection {
      stroke: url(#grad-line);
      stroke-width: 1.5;
      stroke-dasharray: 6, 6;
      animation: dash 30s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
  </style>
  <defs>
    <linearGradient id="grad-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF93C4" />
      <stop offset="50%" stop-color="#FF69B4" />
      <stop offset="100%" stop-color="#F8BBD0" />
    </linearGradient>
    <linearGradient id="grad-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF93C4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF69B4" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" rx="15" class="bg" />
  
  <!-- Animated Grid Background -->
  <g opacity="0.3">
    <!-- horizontal -->
    <line x1="0" y1="50" x2="800" y2="50" class="grid-line" />
    <line x1="0" y1="100" x2="800" y2="100" class="grid-line" />
    <line x1="0" y1="150" x2="800" y2="150" class="grid-line" />
    <line x1="0" y1="200" x2="800" y2="200" class="grid-line" />
    <line x1="0" y1="250" x2="800" y2="250" class="grid-line" />
    <!-- vertical -->
    <line x1="100" y1="0" x2="100" y2="300" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="300" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="300" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="300" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="300" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="300" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="300" class="grid-line" />
  </g>
  
  <!-- Animated Neural Network Nodes -->
  <g transform="translate(600, 150)">
    <!-- Connections -->
    <line x1="-120" y1="-50" x2="-40" y2="-80" class="connection" />
    <line x1="-120" y1="50" x2="-40" y2="80" class="connection" />
    <line x1="-40" y1="-80" x2="60" y2="-40" class="connection" />
    <line x1="-40" y1="80" x2="60" y2="40" class="connection" />
    <line x1="60" y1="-40" x2="100" y2="0" class="connection" />
    <line x1="60" y1="40" x2="100" y2="0" class="connection" />
    <line x1="-120" y1="-50" x2="-120" y2="50" class="connection" />
    <line x1="-40" y1="-80" x2="-40" y2="80" class="connection" />
    <line x1="60" y1="-40" x2="60" y2="40" class="connection" />
    
    <!-- Central glows and nodes -->
    <!-- Node 1 -->
    <circle cx="-120" cy="-50" r="10" class="node-glow" style="animation-delay: 0s;" />
    <circle cx="-120" cy="-50" r="5" class="node" style="animation-delay: 0s;" />
    
    <!-- Node 2 -->
    <circle cx="-120" cy="50" r="10" class="node-glow" style="animation-delay: 1s;" />
    <circle cx="-120" cy="50" r="5" class="node" style="animation-delay: 1s;" />
    
    <!-- Node 3 -->
    <circle cx="-40" cy="-80" r="12" class="node-glow" style="animation-delay: 2s;" />
    <circle cx="-40" cy="-80" r="6" class="node" style="animation-delay: 2s;" />

    <!-- Node 4 -->
    <circle cx="-40" cy="80" r="12" class="node-glow" style="animation-delay: 1.5s;" />
    <circle cx="-40" cy="80" r="6" class="node" style="animation-delay: 1.5s;" />

    <!-- Node 5 -->
    <circle cx="60" cy="-40" r="10" class="node-glow" style="animation-delay: 0.5s;" />
    <circle cx="60" cy="-40" r="5" class="node" style="animation-delay: 0.5s;" />

    <!-- Node 6 -->
    <circle cx="60" cy="40" r="10" class="node-glow" style="animation-delay: 2.5s;" />
    <circle cx="60" cy="40" r="5" class="node" style="animation-delay: 2.5s;" />

    <!-- Core Node -->
    <circle cx="100" cy="0" r="16" class="node-glow" style="animation-delay: 0.8s; fill: #EF93C4;" />
    <circle cx="100" cy="0" r="8" class="node" style="animation-delay: 0.8s; fill: #ffffff;" />
  </g>
  
  <!-- Text Elements -->
  <text x="50" y="130" class="title">MOUNIKA RAYAPALLI</text>
  <text x="54" y="170" class="subtitle">AI TRAINEE &amp; DEVOPS ENTHUSIAST</text>
  
  <!-- Glowing decorative lines -->
  <path d="M 50 190 L 450 190" stroke="url(#grad-title)" stroke-width="2" stroke-linecap="round" />
</svg>
