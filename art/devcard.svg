<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cb8589" />
      <stop offset="50%" stop-color="#b37579" />
      <stop offset="100%" stop-color="#cb8589" />
    </linearGradient>
    <!-- Green Pulse Glow -->
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#4AF2A1" flood-opacity="0.8" />
    </filter>
  </defs>
  <style>
    .card-bg {
      fill: #0d1117;
      stroke: url(#border-grad);
      stroke-width: 1.5;
      rx: 10;
    }
    .card-title {
      font-family: 'Space Mono', 'Segoe UI', monospace;
      font-size: 14px;
      font-weight: bold;
      fill: #ffffff;
    }
    .card-text {
      font-family: 'Segoe UI', sans-serif;
      font-size: 11.5px;
      fill: #8b949e;
    }
    .card-highlight {
      fill: #cb8589;
      font-weight: 600;
    }
    .pulse-dot {
      fill: #4AF2A1;
      animation: pulse-animation 2s infinite;
      transform-origin: 25px 127px;
      transform-box: fill-box;
    }
    @keyframes pulse-animation {
      0% {
        transform: scale(0.9);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.3);
        opacity: 1;
      }
      100% {
        transform: scale(0.9);
        opacity: 0.6;
      }
    }
  </style>
  
  <!-- Card Background -->
  <rect width="320" height="180" class="card-bg" />
  
  <!-- Card Grid Accent -->
  <g fill="#30363d" opacity="0.4">
    <circle cx="280" cy="30" r="1" />
    <circle cx="290" cy="30" r="1" />
    <circle cx="300" cy="30" r="1" />
    <circle cx="280" cy="40" r="1" />
    <circle cx="290" cy="40" r="1" />
    <circle cx="300" cy="40" r="1" />
    <circle cx="280" cy="50" r="1" />
    <circle cx="290" cy="50" r="1" />
    <circle cx="300" cy="50" r="1" />
  </g>
  
  <!-- Content -->
  <!-- Name -->
  <text x="20" y="35" class="card-title">mounika_rayapalli.json</text>
  <line x1="20" y1="45" x2="300" y2="45" stroke="#30363d" stroke-width="1" />
  
  <!-- Profile details -->
  <text x="20" y="68" class="card-text">
    <tspan class="card-highlight">role:</tspan> "AI &amp; DevOps Trainee"
  </text>
  
  <text x="20" y="88" class="card-text">
    <tspan class="card-highlight">training:</tspan> "Calibo AI Academy"
  </text>
  
  <text x="20" y="108" class="card-text">
    <tspan class="card-highlight">location:</tspan> "Vijayawada, India"
  </text>
  
  <!-- Pulse Dot Indicator -->
  <circle cx="25" cy="127" r="4" class="pulse-dot" filter="url(#green-glow)" />
  <text x="38" y="131" class="card-text" fill="#4AF2A1" font-weight="bold">status: "Open to Internships"</text>
  
  <text x="20" y="153" class="card-text">
    <tspan class="card-highlight">motto:</tspan> "Build, test, refine."
  </text>
</svg>
